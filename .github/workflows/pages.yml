# Publishes Rad Roots to GitHub Pages on every push to the branches below.
# The site is static, so the job only copies the app files and hands them to Pages.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/kids-square-roots-app-nqzdx0, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
          touch _site/.nojekyll
      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
