# Publishes Rad Roots to GitHub Pages on every push to the branches below.
# The site is static: the job copies the app files into _site and force-pushes them to the
# gh-pages branch, which GitHub Pages serves at https://anwaryu.github.io/Repo1/.
# The gh-pages branch is generated output; never edit it by hand.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/kids-square-roots-app-nqzdx0, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site
        run: |
          mkdir -p _site
          cp -r index.html sw.js manifest.webmanifest css js icons _site/
          touch _site/.nojekyll
      - name: Push to the gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish Rad Roots from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
